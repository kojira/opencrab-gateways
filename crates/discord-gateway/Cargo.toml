[package]
name = "opencrab-discord-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sha2.workspace = true
base64 = "0.22"
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.2"
rusqlite.workspace = true
chrono.workspace = true
libc.workspace = true
opencrab-process-supervisor.workspace = true
async-trait.workspace = true
serenity.workspace = true
# serenity の Webhook.token は secrecy::Secret<String>。`/webhook set` が作った/再利用した
# webhook のトークンを URL に組むためだけに、同じ secrecy を直接参照する。
secrecy = "0.8"
songbird.workspace = true
# songbird の symphonia レジストリに wav/pcm デコーダを有効化する（TTS 再生用）
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
dashmap.workspace = true
axum.workspace = true
reqwest.workspace = true
opencrab-gate-client.workspace = true

[[bin]]
name = "discord-gateway"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
