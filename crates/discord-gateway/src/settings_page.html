<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord gateway 設定</title>
<style>
:root { color-scheme: light dark; --gap: .75rem; --line: #8886; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", "Noto Sans JP", sans-serif; max-width: 860px; margin: 0 auto; padding: 1rem; }
h1 { font-size: 1.35rem; margin: .25rem 0 .5rem; }
h2 { font-size: 1.1rem; margin: 1.25rem 0 .5rem; padding-bottom: .25rem; border-bottom: 1px solid var(--line); }
p { margin: .4rem 0; }
fieldset { margin: 0 0 var(--gap); padding: .75rem; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
legend { font-weight: 600; padding: 0 .35rem; }
label { display: block; margin: 0 0 var(--gap); }
input:not([type=checkbox]):not([type=radio]), select, textarea { display: block; width: 100%; margin-top: .25rem; font: inherit; font-size: 16px; padding: .55rem .65rem; border: 1px solid #8888; border-radius: 6px; }
textarea { min-height: 5em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
button { font: inherit; font-size: 16px; min-height: 44px; padding: .5rem 1rem; margin: .25rem .5rem .25rem 0; border: 1px solid #8888; border-radius: 8px; cursor: pointer; }
label.check { display: flex; align-items: center; gap: .6rem; }
label.check input { width: 1.4rem; height: 1.4rem; margin: 0; flex: none; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: var(--gap); }
@media (min-width: 640px) {
  .grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
.inline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; }
.inline > button { margin: 0; }
.id, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; overflow-wrap: anywhere; }
.muted { color: #888; font-size: .9rem; }
.status { white-space: pre-wrap; overflow-wrap: anywhere; color: #888; font-size: .95rem; }
.status:empty { display: none; }
nav { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
nav button { margin: 0; }
nav button.active { font-weight: 700; border-width: 2px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid var(--line); padding: .4rem .5rem; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
iframe { width: 100%; border: 1px solid var(--line); border-radius: 8px; height: 1100px; }
.aizuchi-words { list-style: none; padding: 0; margin: -.25rem 0 var(--gap); }
.aizuchi-words li { display: flex; gap: .6rem; align-items: center; margin: .25rem 0; }
.aizuchi-words li button { flex: 0 0 auto; min-width: 44px; margin: 0; padding: .25rem .6rem; }
.aizuchi-words li span:first-of-type { flex: 1; }
</style>
</head>
<body>
<h1>Discord gateway 設定</h1>
<p class="muted">保存すると数秒で反映されます（そのエージェントの bot だけつなぎ直します）。bot トークンは表示しません。</p>
<nav id="tabs"></nav>
<div id="panel"></div>
<fieldset id="create"><legend>新しいエージェントの bot</legend>
  <p class="muted">bot をまだ持っていないエージェントに bot を付けます。トークンは Discord に確認して bot ID を自動で入れます（表示はしません）。</p>
  <label>エージェント<select id="c-agent"></select></label>
  <label>bot トークン<input id="c-token" type="password" autocomplete="off"></label>
  <label>オーナー（Discord ユーザー ID。改行区切り）<textarea id="c-owners"></textarea></label>
  <div class="grid c2">
    <label>サーバー ID（DM は空欄）<input id="c-guild"></label>
    <label>チャンネル ID<input id="c-channel"></label>
  </div>
  <button id="c-save">bot を作る</button>
  <div class="status" id="c-status"></div>
</fieldset>
<script>
const api = "api/instances";
const aizuchiMaxWords = 20;
const aizuchiMaxChars = 20;
let instances = [];
let current = null;

function lines(text) { return text.split(/[\s,]+/).map(s => s.trim()).filter(Boolean); }
async function errorText(res) {
  try { return (await res.json()).error || res.statusText; } catch { return res.statusText; }
}
async function put(path, body, status) {
  status.textContent = "保存しています…";
  const res = await fetch(`${api}/${current.instance_id}/${path}`, {
    method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  status.textContent = res.ok ? "保存しました。数秒で反映されます。" : `保存できません: ${await errorText(res)}`;
  if (res.ok) await load(current.instance_id);
}

// D-1101b: one ▶ per aizuchi word; plays the WAV this bot would play in the VC.
let playing = null;
async function playAizuchi(text, status) {
  status.textContent = "音声を用意しています…";
  const res = await fetch(`${api}/${current.instance_id}/aizuchi/preview`, {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }),
  });
  if (!res.ok) { status.textContent = await errorText(res); return; }
  const url = URL.createObjectURL(await res.blob());
  if (playing) playing.pause();
  playing = new Audio(url);
  playing.onended = () => URL.revokeObjectURL(url);
  status.textContent = "";
  try { await playing.play(); } catch { status.textContent = "ブラウザが再生を止めました。もう一度押してください。"; }
}
function playList(value, list) {
  list.innerHTML = "";
  for (const word of value.split("\n").map(s => s.trim()).filter(Boolean)) {
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "▶";
    button.title = "この bot の声で再生";
    const label = document.createElement("span");
    label.textContent = word;
    const status = document.createElement("span");
    status.className = "status";
    button.onclick = () => playAizuchi(word, status);
    li.append(button, label, status);
    list.append(li);
  }
}

function tabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  for (const inst of instances) {
    const b = document.createElement("button");
    b.textContent = inst.config.name || inst.agent_id;
    b.className = current && current.instance_id === inst.instance_id ? "active" : "";
    b.onclick = () => { current = inst; render(); };
    nav.appendChild(b);
  }
  const v = document.createElement("button");
  v.textContent = "VC 設定（全エージェント共通）";
  v.className = current === "voice" ? "active" : "";
  v.onclick = () => { current = "voice"; render(); };
  nav.appendChild(v);
}

function field(label, value, name, multi) {
  const id = `f-${name}`;
  const input = multi ? `<textarea id="${id}">${value}</textarea>` : `<input id="${id}" value="${value}">`;
  return `<label>${label}${input}</label>`;
}

function render() {
  tabs();
  const panel = document.getElementById("panel");
  if (current === "voice") {
    // The embedded page calls api/voice-settings relative to voice/.
    panel.innerHTML = `<iframe src="voice/"></iframe>`;
    return;
  }
  const c = current.config;
  const access = c.access || {};
  const coAgents = Object.entries(access.co_agents || {}).map(([u, a]) => `${u}=${a}`).join("\n");
  const reactions = c.system_reactions || {};
  const aizuchi = c.aizuchi || { enabled: true, question: [], statement: [] };
  panel.innerHTML = `
<p class="muted">エージェント <span class="id">${current.agent_id}</span> ／ 状態: ${current.lifecycle_state}${current.last_exit ? `（直近: ${current.last_exit}）` : ""}</p>
<fieldset><legend>起動・停止</legend>
  <div class="inline"><span>${current.enabled ? "起動中（有効）" : "停止中（無効）"}</span>
  <button id="toggle">${current.enabled ? "停止する" : "起動する"}</button></div>
  <div class="status" id="s-enabled"></div>
</fieldset>
<fieldset><legend>bot トークン</legend>
  <p class="muted">${current.credential_configured ? "設定済み" : "未設定"}（表示しません。差し替えるときだけ入力。Discord に確認して bot ID も合わせます）</p>
  <p>bot ID: <span class="id">${c.self_bot_id}</span></p>
  <input id="f-token" type="password" autocomplete="off" placeholder="新しいトークン">
  <button id="save-token">トークンを差し替える</button>
  <div class="status" id="s-token"></div>
</fieldset>
<fieldset><legend>基本とアクセス</legend>
  ${field("表示名", c.name || "", "name")}
  ${field("オーナー（Discord ユーザー ID。改行区切り）", (access.owners || []).join("\n"), "owners", true)}
  ${field("信頼済みユーザー（Discord ユーザー ID。改行区切り）", (access.trusted_users || []).join("\n"), "trusted", true)}
  ${field("co-agent（Discord ユーザー ID=エージェント ID。改行区切り）", coAgents, "co", true)}
  <label>配送モード<select id="f-mode">
    <option value="tool_driven">tool_driven</option><option value="say">say</option></select></label>
  <div class="grid c4">
    ${field("受理", reactions.accepted || "👀", "r-accepted")}
    ${field("完了", reactions.completed || "🏁", "r-completed")}
    ${field("失敗", reactions.failed || "❌", "r-failed")}
    ${field("無返信", reactions.no_reply || "🤐", "r-no_reply")}
  </div>
  <button id="save-config">保存</button>
  <div class="status" id="s-config"></div>
</fieldset>
<fieldset><legend>相づち（VC）</legend>
  <p class="muted">話し終わったあと、返事の前に流す短い言葉です。1行に1つ書きます（${aizuchiMaxWords}個まで、1つ${aizuchiMaxChars}文字まで）。空にすると、その場面では流しません。</p>
  <label class="check"><input id="f-aizuchi-on" type="checkbox"><span>相づちを流す</span></label>
  ${field("問いかけのとき（「か」「の」「？」で終わる発話）", aizuchi.question.join("\n"), "aizuchi-q", true)}
  <ul class="aizuchi-words" id="w-aizuchi-q"></ul>
  ${field("それ以外のとき", aizuchi.statement.join("\n"), "aizuchi-s", true)}
  <ul class="aizuchi-words" id="w-aizuchi-s"></ul>
  <p class="muted">▶ を押すと、この bot の声で実際に流れる音声を再生します（保存前の言葉も試せます）。</p>
  <button id="save-aizuchi">保存</button>
  <div class="status" id="s-aizuchi"></div>
</fieldset>
<fieldset><legend>チャンネルを追加</legend>
  <div class="grid c2">${field("サーバー ID（DM は空欄）", "", "guild")}${field("チャンネル ID", "", "channel")}</div>
  <button id="add-channel">このチャンネルで話せるようにする</button>
</fieldset>
<fieldset><legend>チャンネル（会話できるチャンネルの address。改行区切り）</legend>
  <p class="muted">形式: <span class="id">discord-${current.agent_id}-&lt;サーバー ID&gt;-&lt;チャンネル ID&gt;</span>（DM はサーバー ID を空に）</p>
  <textarea id="f-addresses">${current.addresses.join("\n")}</textarea>
  <button id="save-addresses">保存</button>
  <div class="status" id="s-addresses"></div>
</fieldset>`;
  document.getElementById("f-mode").value = c.delivery_mode || "tool_driven";
  document.getElementById("f-aizuchi-on").checked = aizuchi.enabled;
  for (const name of ["aizuchi-q", "aizuchi-s"]) {
    const area = document.getElementById(`f-${name}`);
    const draw = () => playList(area.value, document.getElementById(`w-${name}`));
    area.addEventListener("input", draw);
    draw();
  }
  document.getElementById("save-aizuchi").onclick = () => {
    const words = id => document.getElementById(id).value.split("\n").map(s => s.trim()).filter(Boolean);
    const next = { ...c, aizuchi: {
      enabled: document.getElementById("f-aizuchi-on").checked,
      question: words("f-aizuchi-q"),
      statement: words("f-aizuchi-s"),
    } };
    put("config", next, document.getElementById("s-aizuchi"));
  };
  document.getElementById("toggle").onclick = () =>
    put("enabled", { enabled: !current.enabled }, document.getElementById("s-enabled"));
  document.getElementById("save-token").onclick = () => {
    const token = document.getElementById("f-token").value.trim();
    document.getElementById("f-token").value = "";
    // The page checks the token with Discord and sets the bot id from it.
    put("credential", { credential: token }, document.getElementById("s-token"));
  };
  document.getElementById("add-channel").onclick = async () => {
    const status = document.getElementById("s-addresses");
    status.textContent = "追加しています…";
    const res = await fetch(`${api}/${current.instance_id}/channels`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ guild_id: document.getElementById("f-guild").value.trim(),
        channel_id: document.getElementById("f-channel").value.trim() }),
    });
    status.textContent = res.ok ? "追加しました。数秒でそのチャンネルで話せます。" : `追加できません: ${await errorText(res)}`;
    if (res.ok) await load(current.instance_id);
  };
  document.getElementById("save-addresses").onclick = () =>
    put("addresses", { addresses: lines(document.getElementById("f-addresses").value) },
      document.getElementById("s-addresses"));
  document.getElementById("save-config").onclick = () => {
    const co = {};
    for (const line of document.getElementById("f-co").value.split("\n")) {
      const [user, agent] = line.split("=").map(s => (s || "").trim());
      if (user && agent) co[user] = agent;
    }
    const next = { ...c };
    const name = document.getElementById("f-name").value.trim();
    if (name) next.name = name; else delete next.name;
    next.access = {
      owners: lines(document.getElementById("f-owners").value),
      trusted_users: lines(document.getElementById("f-trusted").value),
      co_agents: co,
    };
    next.delivery_mode = document.getElementById("f-mode").value;
    next.system_reactions = {
      accepted: document.getElementById("f-r-accepted").value.trim(),
      completed: document.getElementById("f-r-completed").value.trim(),
      failed: document.getElementById("f-r-failed").value.trim(),
      no_reply: document.getElementById("f-r-no_reply").value.trim(),
    };
    put("config", next, document.getElementById("s-config"));
  };
}

async function loadAgents() {
  const select = document.getElementById("c-agent");
  const res = await fetch("api/agents");
  if (!res.ok) { document.getElementById("c-status").textContent = `エージェント一覧を読めません: ${await errorText(res)}`; return; }
  const { agents } = await res.json();
  select.innerHTML = "";
  for (const a of agents.filter(a => !a.has_bot)) {
    const opt = document.createElement("option");
    opt.value = a.id; opt.textContent = `${a.name || a.id}（${a.id}）`;
    select.appendChild(opt);
  }
  if (!select.options.length) document.getElementById("c-status").textContent = "bot を持っていないエージェントはいません。";
}

document.getElementById("c-save").onclick = async () => {
  const status = document.getElementById("c-status");
  const token = document.getElementById("c-token").value.trim();
  document.getElementById("c-token").value = "";
  status.textContent = "Discord にトークンを確認して作っています…";
  const res = await fetch(api, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({
      agent_id: document.getElementById("c-agent").value,
      credential: token,
      owners: lines(document.getElementById("c-owners").value),
      guild_id: document.getElementById("c-guild").value.trim(),
      channel_id: document.getElementById("c-channel").value.trim(),
    }),
  });
  if (!res.ok) { status.textContent = `作れません: ${await errorText(res)}`; return; }
  const body = await res.json();
  status.textContent = `作りました（bot ID ${body.self_bot_id}）。数秒でつながります。`;
  await load(body.instance_id);
  await loadAgents();
};

async function load(keep) {
  const res = await fetch(api);
  if (!res.ok) { document.getElementById("panel").textContent = `読み込めません: ${await errorText(res)}`; return; }
  instances = (await res.json()).instances;
  current = instances.find(i => i.instance_id === keep) || (current === "voice" ? "voice" : instances[0]) || "voice";
  render();
}

load();
loadAgents();
</script>
</body>
</html>
