[package]
name = "opencrab-gateway-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Offline end-to-end tests: real gateways against the pinned OpenCrab core."

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
async-trait.workspace = true
anyhow.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
reqwest.workspace = true
axum.workspace = true
toml.workspace = true
dashmap.workspace = true
base64 = "0.22"
# #898 §13.1 j: 途中配送失敗（GateProbe.fail_say_write）を注入するため。
opencrab-extgate = { workspace = true, features = ["extgate-probe"] }
opencrab-server.workspace = true
opencrab-db.workspace = true
opencrab-llm.workspace = true
opencrab-actions.workspace = true
opencrab-gate-client.workspace = true
opencrab-nostr-gateway.workspace = true
opencrab-discord-gateway.workspace = true
opencrab-gateway.workspace = true
# D-1098: the daemon e2e drives the real daemons with an in-process child.
opencrab-process-supervisor.workspace = true
zeroize = "1"
